<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      http-equiv="Cache-Control"
      content="no-store, no-cache, must-revalidate, max-age=0"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <meta
      name="description"
      content="Apex: session logging, telemetry, leaderboards, challenges, community, and Apex Analysis coaching — one place for every sim you run."
    />
    <meta
      name="keywords"
      content="Apex, sim racing, racing simulator, iRacing, F1, Assetto Corsa, leaderboards, lap times, race telemetry"
    />
    <meta name="robots" content="index, follow" />

    <meta property="og:site_name" content="Apex" />
    <meta property="og:title" content="Apex — Sim racing performance hub" />
    <meta
      property="og:description"
      content="Apex: session logging, telemetry, leaderboards, challenges, community, and Apex Analysis coaching — one place for every sim you run."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://apexsimtracker.com/" />
    <meta property="og:image" content="https://apexsimtracker.com/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Apex — Sim racing performance hub" />
    <meta
      name="twitter:description"
      content="Apex: session logging, telemetry, leaderboards, challenges, community, and Apex Analysis coaching — one place for every sim you run."
    />
    <meta name="twitter:image" content="https://apexsimtracker.com/logo.png" />

    <link rel="icon" type="image/png" href="/logo.png?v=5" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Apex — Sim racing performance hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function reload() {
          var url = new URL(location.href);
          url.searchParams.set("__r", String(Date.now()));
          location.replace(url.toString());
        }
        function showAndReload() {
          var overlay = document.createElement("div");
          overlay.id = "apex-reload-overlay";
          overlay.style.cssText =
            "position:fixed;inset:0;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:18px;z-index:999999;";
          overlay.textContent = "Reloading (app failed to mount)...";
          document.body.appendChild(overlay);
          reload();
        }
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .getRegistrations()
            .then(function (regs) {
              regs.forEach(function (reg) {
                reg.unregister();
              });
            })
            .catch(function () {});
        }
        if ("caches" in window) {
          caches
            .keys()
            .then(function (keys) {
              keys.forEach(function (k) {
                caches.delete(k);
              });
            })
            .catch(function () {});
        }
        var moduleScript =
          document.currentScript && document.currentScript.nextElementSibling;
        if (moduleScript && moduleScript.tagName === "SCRIPT") {
          moduleScript.addEventListener("error", function () {
            showAndReload();
          });
        }
        setTimeout(function () {
          if (window.__APEX_MOUNTED__ !== true) {
            showAndReload();
          }
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
